name: Provider Health Monitoring

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tooling & Browser Dependencies
        run: |
          python tools/install_scrapling.py

      - name: Validate Repository Schema & Config
        run: |
          python tools/validate_repo.py

      - name: Check Domain Health & Redirects
        run: |
          python tools/domain_health.py

      - name: Inspect Provider Health (Tiers L0-L5)
        run: |
          python tools/provider_health.py

      - name: Generate Health Summary Matrix
        run: |
          python tools/report_health_summary.py

      - name: Manage Health Issues & Deduplication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python tools/manage_health_issues.py

      - name: Upload Health Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-reports
          path: reports/
          retention-days: 7
