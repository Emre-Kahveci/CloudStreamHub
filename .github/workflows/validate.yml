name: Validate

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'reports/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Fast Fail — Validate Repository Schema & Metadata
        run: |
          python tools/validate_repo.py

      - name: Set up JDK 17 with Gradle Cache
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Compile and Run All Provider Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --parallel --continue
