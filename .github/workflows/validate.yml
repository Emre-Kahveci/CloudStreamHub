name: Validate

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Tooling Requirements
        run: |
          pip install -r tools/requirements.txt

      - name: Validate Repository Schema & Metadata
        run: |
          python tools/validate_repo.py

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compile and Run Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Build Plugins & Verify plugins.json Generation
        run: |
          ./gradlew make makePluginsJson
          ./gradlew ensureJarCompatibility || true

      - name: Verify Generated Artifacts
        run: |
          python tools/validate_repo.py --verify-artifacts
