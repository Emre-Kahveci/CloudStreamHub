name: Build and Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'reports/**'
  workflow_dispatch:

concurrency:
  group: "build-publish"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tooling Dependencies
        run: |
          pip install -r src/tools/requirements.txt

      - name: Validate Pre-Build Repository Consistency
        run: |
          cd src
          python tools/validate_repo.py

      - name: Run Provider Unit Tests
        run: |
          cd src
          chmod +x gradlew
          ./gradlew test

      - name: Build Plugins (.cs3) & Generate plugins.json
        run: |
          cd src
          ./gradlew make makePluginsJson

      - name: Validate Generated Artifacts Integrity
        run: |
          cd src
          python tools/validate_repo.py --verify-artifacts

      - name: Stage Artifacts Atomically
        run: |
          mkdir -p staging
          cp src/repo.json staging/
          cp src/build/plugins.json staging/
          find src -name "*.cs3" -exec cp {} staging/ \;

      - name: Verify Staging Completeness
        run: |
          echo "Staged files:"
          ls -la staging
          count=$(ls -1 staging/*.cs3 | wc -l)
          if [ "$count" -ne 8 ]; then
            echo "Error: Expected 8 .cs3 artifacts in staging, found $count"
            exit 1
          fi

      - name: Checkout or Bootstrap Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds-dest"
        continue-on-error: true

      - name: Publish Artifacts to builds Branch
        run: |
          if [ ! -d "builds-dest/.git" ]; then
            echo "Initializing orphan builds branch..."
            git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds-dest
            cd builds-dest
            git checkout --orphan builds
            git rm -rf . || true
          else
            cd builds-dest
            git rm -rf *.cs3 plugins.json repo.json || true
          fi

          cp -r ../staging/* .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated publication: ${{ github.sha }} (8 active providers)" || exit 0
          git push origin builds --force
